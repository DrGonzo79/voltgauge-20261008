[project]
name = "voltgauge-api"
version = "0.1.0"
description = "Deterministic used-EV buyer assessment API"
requires-python = ">=3.12"
dependencies = [
  "certifi>=2026.10.19",
  "fastapi==0.118.0",
  "pydantic==2.11.9",
  "uvicorn==0.37.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
